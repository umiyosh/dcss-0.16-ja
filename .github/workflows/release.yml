name: Release

# Release tags look like 0.16-ja-1.0.0: the frozen upstream base, then this
# fork's own version. Requiring a digit after -ja- keeps the older markers
# (0.16-ja, 0.16-ja-a0, 0.16-ja-b1) from publishing a release, so they can be
# pushed to the remote for `git describe` without side effects.
#
# workflow_dispatch builds the artifacts without publishing, which is the way
# to try a change here without spending a tag on it. It needs at least one tag
# reachable from the branch, or the version step below fails.
on:
  push:
    tags:
      - '*-ja-[0-9]*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    # macos-latest is fine again. This used to be pinned because the runner's
    # own macOS became the minimum the release required, but the build now
    # sets a deployment target and builds its dependencies from source
    # instead of taking Homebrew's per-macOS bottles, so the runner version no
    # longer leaks into the artifacts.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TERM: dumb
      # The oldest macOS the artifacts must run on: the floor for arm64, and
      # the default the makefile compiles against. The check below is what
      # proves the artifacts really came out that way.
      MACOS_MIN_TARGET: "11.0"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The version baked into the artifacts comes from `git describe
          # --tags`, which needs the history and the tags. fetch-depth: 0 gets
          # both: despite the --no-tags it passes, actions/checkout also uses
          # an explicit +refs/tags/*:refs/tags/* refspec.
          fetch-depth: 0

      # Nothing to install: SDL2, SDL2_image, FreeType, libpng and zlib come
      # from contrib/build-macos-deps.sh, which needs only cmake and curl.
      # Homebrew is deliberately not used — its bottles are built for the
      # runner's exact macOS, which is what tied an earlier release to it.
      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            crawl-ref/source/contrib/install
            crawl-ref/source/contrib/.macos-deps-build/cache
          key: macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crawl-ref/source/contrib/build-macos-deps.sh') }}

      - name: Check out bundled dependencies
        shell: bash
        run: |
          # macOS ships no lua 5.1 or sqlite development files. The .gitmodules
          # URLs still use git://, which GitHub dropped.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      - name: Show the version being built
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # Fail here rather than 20 minutes into the build: without a tag,
          # util/gen_ver.pl dies looking for the untracked util/release_ver,
          # and `git describe` only says "No names found".
          if ! git describe --tags; then
            echo "error: no tag is reachable from this ref." >&2
            echo "The version comes from git describe, so the remote needs" >&2
            echo "at least one tag. Push one, e.g. git push origin 0.16-ja." >&2
            exit 1
          fi

      - name: Build release artifacts
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # Fall back to 3 rather than letting an empty value turn into a bare
          # -j, which would run unlimited jobs in parallel.
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          make -j"$jobs" dist-macos DISTDIR="$GITHUB_WORKSPACE/dist"

      - name: Check the zipped bundles still verify
        shell: bash
        run: |
          # sign-app-bundle already proved the staged .app is self-contained
          # and signed. What it cannot show is whether zip and unzip preserve
          # that, which is the form users actually receive, nor which macOS
          # the result actually demands.
          cd "$GITHUB_WORKSPACE/dist"
          checker=$GITHUB_WORKSPACE/crawl-ref/source/mac/check-min-os.pl
          for zip in *.zip; do
            rm -rf check && mkdir check
            unzip -q "$zip" -d check
            app=$(find check -maxdepth 1 -name '*.app')
            echo "--- $zip"
            codesign --verify --deep --strict "$app"
            perl "$checker" "$MACOS_MIN_TARGET" "$app"
          done
          rm -rf check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The .app is signed ad-hoc, not with a Developer ID, so macOS
          # quarantines it on download and reports it as damaged. Say so here
          # rather than letting every downloader hit it.
          cat > notes.md <<'EOF'
          ## ダウンロード

          - `*-tiles-macosx.zip` — タイル版（グラフィカル）
          - `*-console-macosx.zip` — コンソール版（文字のみ）

          Apple Silicon (arm64) 専用です。Intel Mac では動きません。

          ## 初回起動について

          署名は ad-hoc のため、ダウンロードした `.app` は macOS に隔離され
          「壊れているため開けません」と表示されます。次のコマンドで隔離属性を
          外してから起動してください。

          ```
          xattr -dr com.apple.quarantine "Dungeon Crawl Stone Soup - Tiles.app"
          ```

          ---
          EOF
          gh release create "$TAG" dist/*.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
