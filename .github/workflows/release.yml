name: Release

# Release tags look like 0.16-ja-1.0.0: the frozen upstream base, then this
# fork's own version. Requiring a digit after -ja- keeps the older markers
# (0.16-ja, 0.16-ja-a0, 0.16-ja-b1) from publishing a release, so they can be
# pushed to the remote for `git describe` without side effects.
#
# workflow_dispatch builds the artifacts without publishing, which is the way
# to try a change here without spending a tag on it. It needs at least one tag
# reachable from the branch, or the version step below fails.
on:
  push:
    tags:
      - '*-ja-[0-9]*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  macos:
    name: macOS (Apple Silicon)
    # macos-latest is fine again. This used to be pinned because the runner's
    # own macOS became the minimum the release required, but the build now
    # sets a deployment target and builds its dependencies from source
    # instead of taking Homebrew's per-macOS bottles, so the runner version no
    # longer leaks into the artifacts.
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      TERM: dumb
      # The oldest macOS the artifacts must run on: the floor for arm64, and
      # the default the makefile compiles against. The check below is what
      # proves the artifacts really came out that way.
      MACOS_MIN_TARGET: "11.0"
      # A step's `if` cannot read the secrets context, and cannot read env set
      # by that same step either, so the presence check has to be reduced to a
      # job-level boolean. Keeping it a boolean rather than the secret itself
      # also avoids putting the certificate in every step's environment.
      HAVE_SIGNING: ${{ secrets.MACOS_CERTIFICATE != ''
                        && secrets.NOTARY_PRIVATE_KEY != '' }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          # The version baked into the artifacts comes from `git describe
          # --tags`, which needs the history and the tags. fetch-depth: 0 gets
          # both: despite the --no-tags it passes, actions/checkout also uses
          # an explicit +refs/tags/*:refs/tags/* refspec.
          fetch-depth: 0

      # Nothing to install: SDL2, SDL2_image, FreeType, libpng and zlib come
      # from contrib/build-macos-deps.sh, which needs only cmake and curl.
      # Homebrew is deliberately not used — its bottles are built for the
      # runner's exact macOS, which is what tied an earlier release to it.
      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            crawl-ref/source/contrib/install
            crawl-ref/source/contrib/.macos-deps-build/cache
          key: macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crawl-ref/source/contrib/build-macos-deps.sh') }}

      - name: Check out bundled dependencies
        shell: bash
        run: |
          # macOS ships no lua 5.1 or sqlite development files. The .gitmodules
          # URLs still use git://, which GitHub dropped.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      # Everything below degrades to an ad-hoc signed, un-notarized bundle
      # when the secrets are absent, so forks and manual runs still work.
      - name: Set up signing and notarization
        if: env.HAVE_SIGNING == 'true'
        shell: bash
        env:
          MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          NOTARY_PRIVATE_KEY: ${{ secrets.NOTARY_PRIVATE_KEY }}
        run: |
          # A dedicated keychain, thrown away with the runner. Importing into
          # the login keychain would need its password and would leave the key
          # sitting in a shared store.
          keychain="$RUNNER_TEMP/signing.keychain-db"
          password=$(uuidgen)

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"

          echo "$MACOS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" \
            -P "$MACOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm -f "$RUNNER_TEMP/cert.p12"

          # Without this codesign blocks on a GUI prompt for keychain access,
          # which never gets answered on a runner.
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$password" "$keychain" > /dev/null

          # Put it in the search list, or codesign cannot find the identity.
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

          identity=$(security find-identity -v -p codesigning "$keychain" \
                     | grep 'Developer ID Application' \
                     | head -1 \
                     | perl -ne 'print $1 if /"([^"]+)"/')
          if [ -z "$identity" ]; then
            echo "error: no Developer ID Application identity in the keychain" >&2
            security find-identity -v -p codesigning "$keychain" >&2
            exit 1
          fi
          echo "identity: $identity"
          echo "MACOS_SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

          echo "$NOTARY_PRIVATE_KEY" | base64 --decode > "$RUNNER_TEMP/notary.p8"
          echo "NOTARY_KEY_PATH=$RUNNER_TEMP/notary.p8" >> "$GITHUB_ENV"

      - name: Show the version being built
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # Fail here rather than 20 minutes into the build: without a tag,
          # util/gen_ver.pl dies looking for the untracked util/release_ver,
          # and `git describe` only says "No names found".
          if ! git describe --tags; then
            echo "error: no tag is reachable from this ref." >&2
            echo "The version comes from git describe, so the remote needs" >&2
            echo "at least one tag. Push one, e.g. git push origin 0.16-ja." >&2
            exit 1
          fi

      - name: Build release artifacts
        shell: bash
        working-directory: crawl-ref/source
        # MACOS_SIGN_IDENTITY and NOTARY_KEY_PATH arrive through GITHUB_ENV
        # from the signing step; these two are plain identifiers with no file
        # to write, so they come straight from the secrets. All four have to
        # be present or notarytool rejects the submission.
        env:
          NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
          NOTARY_ISSUER_ID: ${{ secrets.NOTARY_ISSUER_ID }}
        run: |
          # Fall back to 3 rather than letting an empty value turn into a bare
          # -j, which would run unlimited jobs in parallel.
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          make -j"$jobs" dist-macos DISTDIR="$GITHUB_WORKSPACE/dist"

      - name: Check the zipped bundles still verify
        shell: bash
        run: |
          # sign-app-bundle already proved the staged .app is self-contained
          # and signed. What it cannot show is whether zip and unzip preserve
          # that, which is the form users actually receive, nor which macOS
          # the result actually demands.
          cd "$GITHUB_WORKSPACE/dist"
          checker=$GITHUB_WORKSPACE/crawl-ref/source/mac/check-min-os.pl
          for zip in *.zip; do
            rm -rf check && mkdir check
            ditto -x -k "$zip" check
            app=$(find check -maxdepth 1 -name '*.app')
            echo "--- $zip"
            codesign --verify --deep --strict "$app"
            perl "$checker" "$MACOS_MIN_TARGET" "$app"
            if [ "$HAVE_SIGNING" = "true" ]; then
              # The whole point of stapling is that it survives the download,
              # so check it on the unpacked copy rather than the staged one.
              # spctl is the same question Gatekeeper asks on first launch.
              xcrun stapler validate "$app"
              spctl -a -vv "$app"
            fi
          done
          rm -rf check

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.zip
          if-no-files-found: error

  release:
    name: Publish release
    needs: macos
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Create release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          # The .app is signed ad-hoc, not with a Developer ID, so macOS
          # quarantines it on download and reports it as damaged. Say so here
          # rather than letting every downloader hit it.
          cat > notes.md <<'EOF'
          ## ダウンロード

          - `*-tiles-macosx.zip` — タイル版（グラフィカル）
          - `*-console-macosx.zip` — コンソール版（文字のみ）

          Apple Silicon (arm64) 専用です。Intel Mac では動きません。

          ## 初回起動について

          署名は ad-hoc のため、ダウンロードした `.app` は macOS に隔離され
          「壊れているため開けません」と表示されます。次のコマンドで隔離属性を
          外してから起動してください。

          ```
          xattr -dr com.apple.quarantine "Dungeon Crawl Stone Soup - Tiles.app"
          ```

          ---
          EOF
          gh release create "$TAG" dist/*.zip \
            --title "$TAG" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
