name: Build

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translation-check:
    name: Japanese message coverage
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test translation checker
        run: python3 crawl-ref/source/util/test-check-jtrans

      - name: Check player-visible messages
        run: python3 crawl-ref/source/util/check-jtrans --all

  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.variant.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
        variant:
          - name: Console
            full_debug: ""
            tiles: ""
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Console (debug)
            full_debug: "1"
            tiles: ""
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Tiles
            full_debug: ""
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Tiles (debug)
            full_debug: "1"
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Webtiles
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: ""
          - name: Webtiles (debug)
            full_debug: "1"
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: ""
          - name: DGL
            full_debug: ""
            tiles: ""
            webtiles: ""
            use_dgamelaunch: "1"
            build_all: ""
          - name: DGL Webtiles
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: "1"
            build_all: ""
          - name: Tiles (bundled dependencies)
            full_debug: ""
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: "1"
          - name: Webtiles (bundled dependencies)
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: "1"
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      FORCE_CC: ${{ matrix.compiler.cc }}
      FORCE_CXX: ${{ matrix.compiler.cxx }}
      FULLDEBUG: ${{ matrix.variant.full_debug }}
      TILES: ${{ matrix.variant.tiles }}
      WEBTILES: ${{ matrix.variant.webtiles }}
      USE_DGAMELAUNCH: ${{ matrix.variant.use_dgamelaunch }}
      BUILD_ALL: ${{ matrix.variant.build_all }}
      # The legacy Makefile uses this flag to shorten stress-test timeouts in CI.
      TRAVIS: "1"
      TERM: dumb
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          packages=(
            build-essential
            clang
            gdb
            libfreetype6-dev
            liblua5.1-0-dev
            libncurses-dev
            libpng-dev
            libsdl2-dev
            libsdl2-image-dev
            libsdl2-mixer-dev
            pkg-config
          )
          if [[ -n "$BUILD_ALL" ]]; then
            packages+=(
              libasound2-dev
              libegl1-mesa-dev
              libxss-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      - name: Check out bundled dependencies
        if: matrix.variant.build_all != ''
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init --recursive

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ -n "$FULLDEBUG" ]]; then
            make -j"$(nproc)" debug
          else
            make -j"$(nproc)"
          fi

      - name: Test
        if: matrix.variant.tiles == ''
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ -n "$FULLDEBUG" ]]; then
            make -j2 test
          else
            make nondebugtest
          fi

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  build-macos:
    name: macOS / ${{ matrix.variant.name }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: Console
            tiles: ""
            full_debug: ""
          - name: Console (debug)
            tiles: ""
            full_debug: "1"
          - name: Tiles
            tiles: "1"
            full_debug: ""
    env:
      TILES: ${{ matrix.variant.tiles }}
      FULLDEBUG: ${{ matrix.variant.full_debug }}
      TERM: dumb
      # The Lua tests compare Japanese item names, so the locale has to be
      # UTF-8. macOS runners leave LANG unset, which lands us in the C locale
      # and turns 死体 into 死ä½“ before the comparison.
      LANG: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Nothing to install: console links the system ncurses, and tiles gets
      # SDL2, SDL2_image, FreeType, libpng and zlib from
      # contrib/build-macos-deps.sh, which needs only cmake and curl. Both are
      # already on the runner. Homebrew is deliberately not used here — its
      # bottles are built for the runner's exact macOS, which would tie the
      # artifacts to it.
      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            crawl-ref/source/contrib/install
            crawl-ref/source/contrib/.macos-deps-build/cache
          key: macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crawl-ref/source/contrib/build-macos-deps.sh') }}

      - name: Check out bundled dependencies
        shell: bash
        run: |
          # macOS ships no lua 5.1 or sqlite development files, so those two
          # contribs are always built. The .gitmodules URLs still use git://,
          # which GitHub dropped, hence the rewrite.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # Fall back to 3 rather than letting an empty value turn into a bare
          # -j, which would run unlimited jobs in parallel.
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          if [[ -n "$TILES" ]]; then
            make TILES=y -j"$jobs"
          elif [[ -n "$FULLDEBUG" ]]; then
            make debug -j"$jobs"
          else
            make SHAREDDIR="$RUNNER_TEMP/dcss-death-endgame/shared" -j"$jobs"
          fi

      - name: Check the binary runs
        shell: bash
        working-directory: crawl-ref/source
        run: ./crawl --version

      - name: Test normal-game death
        if: matrix.variant.name == 'Console'
        shell: bash
        working-directory: crawl-ref/source
        env:
          DEATH_TEST_ROOT: ${{ runner.temp }}/dcss-death-endgame/run
          DEATH_TEST_SHARED_DIR: ${{ runner.temp }}/dcss-death-endgame/shared
        run: >-
          make
          SHAREDDIR="$RUNNER_TEMP/dcss-death-endgame/shared"
          test-death-endgame

      - name: Assemble the app bundle
        # Only the release workflow ships a .app, and it only runs on tags,
        # so without this nothing exercises the bundling until release day.
        # It is cheap here: the flags match the build above, so mac-app-tiles
        # reuses the objects and only runs the packaging steps. sign-app-bundle
        # is what fails if the bundle is not self-contained.
        #
        # The min-os check matters most on this job: the runner is whatever
        # macos-latest currently is, so it is the one place that proves a
        # build on a brand new macOS still produces artifacts that run on old
        # ones. A release once shipped requiring macOS 26 for exactly this
        # reason, and every other check passed.
        if: matrix.variant.tiles != ''
        shell: bash
        working-directory: crawl-ref/source
        run: |
          make TILES=y mac-app-tiles
          perl mac/check-min-os.pl 11.0 \
               "build/app-bundle-stage/Dungeon Crawl Stone Soup - Tiles.app"

      - name: Test
        # -test only exists in a FULLDEBUG build, and `debug` has to stay in
        # the goal list: the Makefile keys DEBUG and NO_OPTIMIZE off
        # MAKECMDGOALS, so dropping it here changes the flags and forces a
        # full rebuild. Only test-test is run; test-all is the stress suite,
        # which allows up to 595s per case.
        if: matrix.variant.full_debug != ''
        shell: bash
        working-directory: crawl-ref/source
        run: make debug test-test

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi
