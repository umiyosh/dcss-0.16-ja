name: Build

on:
  pull_request:
    branches:
      - develop
  schedule:
    # 03:17 JST. Avoid the start of the hour, when scheduled workflows are
    # more likely to be delayed.
    - cron: '17 18 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: Select CI scope
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.classify.outputs.scope }}
      linux_matrix: ${{ steps.classify.outputs.linux_matrix }}
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test change classifier
        run: >-
          python3 -m unittest discover
          -s .github/scripts
          -p 'test_*.py'

      - name: Classify changed files
        id: classify
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [[ "$EVENT_NAME" == pull_request ]]; then
            scope="$(
              git diff --name-only -z "$BASE_SHA" "$HEAD_SHA" |
                python3 .github/scripts/classify_ci_changes.py --null
            )"
            case "$scope" in
              docs)
                matrix_scope=data
                ;;
              data)
                matrix_scope=data
                ;;
              full)
                # Four non-Linux jobs plus these 14 builds keep the initial
                # fan-out below the 20-job limit. The three macOS test shards
                # start only after their debug build completes.
                matrix_scope=pr
                ;;
              *)
                echo "Unknown CI scope: $scope" >&2
                exit 1
                ;;
            esac
          else
            scope=full
            matrix_scope=full
          fi
          linux_matrix="$(
            jq --compact-output ".${matrix_scope}" .github/ci-matrices.json
          )"
          printf 'scope=%s\n' "$scope" >> "$GITHUB_OUTPUT"
          printf 'linux_matrix=%s\n' "$linux_matrix" >> "$GITHUB_OUTPUT"
          printf 'Selected CI scope: %s (%s matrix)\n' \
            "$scope" "$matrix_scope"

  translation-check:
    name: Japanese message coverage
    needs: changes
    if: ${{ needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Test translation checker
        run: |
          python3 crawl-ref/source/util/test-check-jtrans
          python3 crawl-ref/source/util/test-check-lua-jtrans

      - name: Check player-visible messages
        run: |
          python3 crawl-ref/source/util/check-jtrans --all
          python3 crawl-ref/source/util/check-lua-jtrans

  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.variant.name }}
    needs: changes
    if: ${{ needs.changes.outputs.scope != 'docs' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.linux_matrix) }}
    env:
      CC: ccache ${{ matrix.compiler.cc }}
      CXX: ccache ${{ matrix.compiler.cxx }}
      FORCE_CC: ccache ${{ matrix.compiler.cc }}
      FORCE_CXX: ccache ${{ matrix.compiler.cxx }}
      # Normalize the checkout path so objects remain reusable across runners.
      CCACHE_BASEDIR: ${{ github.workspace }}
      # Runner image updates can replace a compiler without changing its name.
      CCACHE_COMPILERCHECK: content
      # Twenty scheduled variants must coexist within GitHub's cache quota.
      CCACHE_MAXSIZE: 150M
      FULLDEBUG: ${{ matrix.variant.full_debug }}
      TILES: ${{ matrix.variant.tiles }}
      WEBTILES: ${{ matrix.variant.webtiles }}
      USE_DGAMELAUNCH: ${{ matrix.variant.use_dgamelaunch }}
      BUILD_ALL: ${{ matrix.variant.build_all }}
      TEST_MODE: ${{ matrix.variant.test }}
      # The legacy Makefile uses this flag to shorten stress-test timeouts in CI.
      TRAVIS: "1"
      TERM: dumb
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache compiler outputs
        # actions/cache@v4
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ${{ runner.temp }}/ccache
          # Compiler flags differ by variant, so each matrix entry owns an
          # immutable cache. A new SHA restores the latest matching entry and
          # saves its partially refreshed result without cross-job conflicts.
          key: linux-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler.name }}-${{ matrix.variant.name }}-${{ github.sha }}
          restore-keys: linux-ccache-v1-${{ runner.os }}-${{ runner.arch }}-${{ matrix.compiler.name }}-${{ matrix.variant.name }}-

      - name: Install build dependencies
        shell: bash
        run: |
          packages=(
            ccache
            libncurses-dev
            pkgconf
          )
          if [[ -z "$BUILD_ALL" ]]; then
            packages+=(liblua5.1-0-dev)
          fi
          if [[ -n "$TILES" && -z "$BUILD_ALL" ]]; then
            packages+=(
              libfreetype6-dev
              libpng-dev
              libsdl2-dev
              libsdl2-image-dev
            )
          elif [[ -n "$WEBTILES" && -z "$BUILD_ALL" ]]; then
            packages+=(libpng-dev)
          fi
          if [[ -n "$BUILD_ALL" ]]; then
            packages+=(
              libasound2-dev
              libegl1-mesa-dev
              libsdl2-dev
              libxss-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      - name: Initialize compiler cache statistics
        env:
          CCACHE_DIR: ${{ runner.temp }}/ccache
        run: |
          printf 'CCACHE_DIR=%s\n' "$CCACHE_DIR" >> "$GITHUB_ENV"
          ccache --zero-stats

      - name: Check out bundled dependencies
        if: matrix.variant.build_all != ''
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init --recursive

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ -n "$FULLDEBUG" ]]; then
            make -j"$(nproc)" debug
          else
            make -j"$(nproc)"
          fi

      - name: Check the binary runs
        working-directory: crawl-ref/source
        run: ./crawl --version

      - name: Test
        # The gameplay suites do not branch on Tiles, WebTiles or DGL flags.
        # Every variant is still compiled and started above; the full suites
        # run only on representative Console release/debug builds.
        if: matrix.variant.test != ''
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ "$TEST_MODE" == debug ]]; then
            make -j2 test
          else
            make nondebugtest
          fi

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  build-macos:
    name: macOS / ${{ matrix.variant.name }}
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'full' }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: Console
            tiles: ""
          - name: Tiles
            tiles: "1"
    env:
      TILES: ${{ matrix.variant.tiles }}
      TERM: dumb
      LANG: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      # Nothing to install: console links the system ncurses, and tiles gets
      # SDL2, SDL2_image, FreeType, libpng and zlib from
      # contrib/build-macos-deps.sh, which needs only cmake and curl. Both are
      # already on the runner. Homebrew is deliberately not used here — its
      # bottles are built for the runner's exact macOS, which would tie the
      # artifacts to it.
      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            crawl-ref/source/contrib/install
            crawl-ref/source/contrib/.macos-deps-build/cache
          key: macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crawl-ref/source/contrib/build-macos-deps.sh') }}

      - name: Check out bundled dependencies
        shell: bash
        run: |
          # macOS ships no lua 5.1 or sqlite development files, so those two
          # contribs are always built. The .gitmodules URLs still use git://,
          # which GitHub dropped, hence the rewrite.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # Fall back to 3 rather than letting an empty value turn into a bare
          # -j, which would run unlimited jobs in parallel.
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          if [[ -n "$TILES" ]]; then
            make TILES=y -j"$jobs"
          else
            make SHAREDDIR="$RUNNER_TEMP/dcss-death-endgame/shared" -j"$jobs"
          fi

      - name: Check the binary runs
        shell: bash
        working-directory: crawl-ref/source
        run: ./crawl --version

      - name: Test normal-game death
        if: matrix.variant.name == 'Console'
        shell: bash
        working-directory: crawl-ref/source
        env:
          DEATH_TEST_ROOT: ${{ runner.temp }}/dcss-death-endgame/run
          DEATH_TEST_SHARED_DIR: ${{ runner.temp }}/dcss-death-endgame/shared
        run: >-
          make
          SHAREDDIR="$RUNNER_TEMP/dcss-death-endgame/shared"
          test-death-endgame

      - name: Assemble the app bundle
        # Only the release workflow ships a .app, and it only runs on tags,
        # so without this nothing exercises the bundling until release day.
        # It is cheap here: the flags match the build above, so mac-app-tiles
        # reuses the objects and only runs the packaging steps. sign-app-bundle
        # is what fails if the bundle is not self-contained.
        #
        # The min-os check matters most on this job: the runner is whatever
        # macos-latest currently is, so it is the one place that proves a
        # build on a brand new macOS still produces artifacts that run on old
        # ones. A release once shipped requiring macOS 26 for exactly this
        # reason, and every other check passed.
        if: matrix.variant.tiles != ''
        shell: bash
        working-directory: crawl-ref/source
        run: |
          make TILES=y mac-app-tiles
          perl mac/check-min-os.pl 11.0 \
               "build/app-bundle-stage/Dungeon Crawl Stone Soup - Tiles.app"

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  # Keep this build independent from the release/Tiles matrix so its test
  # shards can start as soon as the reusable debug binary is available.
  build-macos-debug:
    name: macOS / Console (debug) build
    needs: changes
    if: ${{ needs.changes.outputs.scope == 'full' }}
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      TERM: dumb
      LANG: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Cache the built dependencies
        uses: actions/cache@v4
        with:
          path: |
            crawl-ref/source/contrib/install
            crawl-ref/source/contrib/.macos-deps-build/cache
          key: macos-deps-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('crawl-ref/source/contrib/build-macos-deps.sh') }}

      - name: Check out bundled dependencies
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          make debug -j"$jobs"

      - name: Check the binary runs
        working-directory: crawl-ref/source
        run: ./crawl --version

      - name: Archive the test runtime
        working-directory: crawl-ref/source
        # tags.lua is generated during the build and is required before the
        # restored binary can rebuild the test database in a fresh checkout.
        run: >-
          tar -czf "$RUNNER_TEMP/macos-console-debug.tar.gz"
          crawl dat/dlua/tags.lua

      - name: Upload the test binary
        # actions/upload-artifact@v4
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: macos-console-debug
          path: ${{ runner.temp }}/macos-console-debug.tar.gz
          compression-level: 0
          retention-days: 1

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  test-macos:
    name: macOS / Console (debug) tests ${{ matrix.display }}/3
    needs:
      - changes
      - build-macos-debug
    if: ${{ needs.changes.outputs.scope == 'full' }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: 0
            display: 1
          - shard: 1
            display: 2
          - shard: 2
            display: 3
    env:
      TRAVIS: "1"
      TERM: dumb
      # The Lua tests compare Japanese item names, so the locale has to be
      # UTF-8. macOS runners leave LANG unset, which lands us in the C locale
      # and turns 死体 into 死ä½“ before the comparison.
      LANG: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Download the test binary
        # actions/download-artifact@v4
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: macos-console-debug
          path: ${{ runner.temp }}/macos-console-debug

      - name: Restore the test binary
        working-directory: crawl-ref/source
        run: >-
          tar -xzf
          "$RUNNER_TEMP/macos-console-debug/macos-console-debug.tar.gz"

      - name: Prepare tests
        working-directory: crawl-ref/source
        run: |
          make util/fake_pty
          ./crawl --builddb

      - name: Test
        working-directory: crawl-ref/source
        run: >-
          python3 ../../.github/scripts/shard_crawl_tests.py
          --shard-index '${{ matrix.shard }}'
          --shard-count 3
          --runner ./util/fake_pty

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  ci-result:
    name: CI result
    if: always()
    needs:
      - changes
      - translation-check
      - build
      - build-macos
      - build-macos-debug
      - test-macos
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Check required jobs
        shell: bash
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          TRANSLATION_RESULT: ${{ needs.translation-check.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          MACOS_RESULT: ${{ needs.build-macos.result }}
          MACOS_DEBUG_BUILD_RESULT: ${{ needs.build-macos-debug.result }}
          MACOS_TEST_RESULT: ${{ needs.test-macos.result }}
        run: |
          for result in \
            "$CHANGES_RESULT" \
            "$TRANSLATION_RESULT" \
            "$BUILD_RESULT" \
            "$MACOS_RESULT" \
            "$MACOS_DEBUG_BUILD_RESULT" \
            "$MACOS_TEST_RESULT"
          do
            if [[ "$result" != success && "$result" != skipped ]]; then
              echo "Required CI job result: $result" >&2
              exit 1
            fi
          done
