name: Build

on:
  pull_request:
    branches:
      - develop

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.compiler.name }} / ${{ matrix.variant.name }}
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - name: GCC
            cc: gcc
            cxx: g++
          - name: Clang
            cc: clang
            cxx: clang++
        variant:
          - name: Console
            full_debug: ""
            tiles: ""
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Console (debug)
            full_debug: "1"
            tiles: ""
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Tiles
            full_debug: ""
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Tiles (debug)
            full_debug: "1"
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: ""
          - name: Webtiles
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: ""
          - name: Webtiles (debug)
            full_debug: "1"
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: ""
          - name: DGL
            full_debug: ""
            tiles: ""
            webtiles: ""
            use_dgamelaunch: "1"
            build_all: ""
          - name: DGL Webtiles
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: "1"
            build_all: ""
          - name: Tiles (bundled dependencies)
            full_debug: ""
            tiles: "1"
            webtiles: ""
            use_dgamelaunch: ""
            build_all: "1"
          - name: Webtiles (bundled dependencies)
            full_debug: ""
            tiles: ""
            webtiles: "1"
            use_dgamelaunch: ""
            build_all: "1"
    env:
      CC: ${{ matrix.compiler.cc }}
      CXX: ${{ matrix.compiler.cxx }}
      FORCE_CC: ${{ matrix.compiler.cc }}
      FORCE_CXX: ${{ matrix.compiler.cxx }}
      FULLDEBUG: ${{ matrix.variant.full_debug }}
      TILES: ${{ matrix.variant.tiles }}
      WEBTILES: ${{ matrix.variant.webtiles }}
      USE_DGAMELAUNCH: ${{ matrix.variant.use_dgamelaunch }}
      BUILD_ALL: ${{ matrix.variant.build_all }}
      # The legacy Makefile uses this flag to shorten stress-test timeouts in CI.
      TRAVIS: "1"
      TERM: dumb
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          packages=(
            build-essential
            clang
            gdb
            libfreetype6-dev
            liblua5.1-0-dev
            libncurses-dev
            libpng-dev
            libsdl2-dev
            libsdl2-image-dev
            libsdl2-mixer-dev
            pkg-config
          )
          if [[ -n "$BUILD_ALL" ]]; then
            packages+=(
              libasound2-dev
              libegl1-mesa-dev
              libxss-dev
            )
          fi
          sudo apt-get update
          sudo apt-get install --yes "${packages[@]}"

      - name: Check out bundled dependencies
        if: matrix.variant.build_all != ''
        shell: bash
        run: |
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init --recursive

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ -n "$FULLDEBUG" ]]; then
            make -j"$(nproc)" debug
          else
            make -j"$(nproc)"
          fi

      - name: Test
        if: matrix.variant.tiles == ''
        shell: bash
        working-directory: crawl-ref/source
        run: |
          if [[ -n "$FULLDEBUG" ]]; then
            make -j2 test
          else
            make nondebugtest
          fi

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi

  build-macos:
    name: macOS / ${{ matrix.variant.name }}
    runs-on: macos-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant:
          - name: Console
            tiles: ""
            full_debug: ""
          - name: Console (debug)
            tiles: ""
            full_debug: "1"
          - name: Tiles
            tiles: "1"
            full_debug: ""
    env:
      TILES: ${{ matrix.variant.tiles }}
      FULLDEBUG: ${{ matrix.variant.full_debug }}
      TERM: dumb
      # The Lua tests compare Japanese item names, so the locale has to be
      # UTF-8. macOS runners leave LANG unset, which lands us in the C locale
      # and turns 死体 into 死ä½“ before the comparison.
      LANG: en_US.UTF-8
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Install build dependencies
        shell: bash
        run: |
          # Console links the system ncurses and needs nothing extra. Tiles
          # cannot use the bundled SDL2: it is a 2014 snapshot that no longer
          # compiles with a current clang.
          if [[ -n "$TILES" ]]; then
            brew install pkg-config sdl2 sdl2_image freetype libpng
          fi

      - name: Check out bundled dependencies
        shell: bash
        run: |
          # macOS ships no lua 5.1 or sqlite development files, so those two
          # contribs are always built. The .gitmodules URLs still use git://,
          # which GitHub dropped, hence the rewrite.
          git config --global url."https://github.com/".insteadOf git://github.com/
          git submodule update --init \
            crawl-ref/source/contrib/lua \
            crawl-ref/source/contrib/sqlite

      - name: Initialize build version
        working-directory: crawl-ref/source
        run: printf '%s\n' 'v0.0-a0' > util/release_ver

      - name: Build
        shell: bash
        working-directory: crawl-ref/source
        run: |
          # NO_APPLE_GCC=y skips the Apple block, whose SDK version detection
          # does not understand a versionless MacOSX.sdk.
          # Fall back to 3 rather than letting an empty value turn into a bare
          # -j, which would run unlimited jobs in parallel.
          jobs=$(sysctl -n hw.ncpu 2>/dev/null || echo 3)
          if [[ -n "$TILES" ]]; then
            make TILES=y NO_APPLE_GCC=y \
                 NO_PKGCONFIG= BUILD_SDL2= BUILD_SDL2IMAGE= \
                 BUILD_FREETYPE= BUILD_LIBPNG= -j"$jobs"
          elif [[ -n "$FULLDEBUG" ]]; then
            make NO_APPLE_GCC=y debug -j"$jobs"
          else
            make NO_APPLE_GCC=y -j"$jobs"
          fi

      - name: Check the binary runs
        shell: bash
        working-directory: crawl-ref/source
        run: ./crawl --version

      - name: Test
        # -test only exists in a FULLDEBUG build, and `debug` has to stay in
        # the goal list: the Makefile keys DEBUG and NO_OPTIMIZE off
        # MAKECMDGOALS, so dropping it here changes the flags and forces a
        # full rebuild. Only test-test is run; test-all is the stress suite,
        # which allows up to 595s per case.
        if: matrix.variant.full_debug != ''
        shell: bash
        working-directory: crawl-ref/source
        run: make NO_APPLE_GCC=y debug test-test

      - name: Print crash reports
        if: failure()
        shell: bash
        working-directory: crawl-ref/source
        run: |
          shopt -s nullglob
          crash_reports=(morgue/crash-*.txt)
          if (( ${#crash_reports[@]} > 0 )); then
            cat "${crash_reports[@]}"
          fi
